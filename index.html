<script>
const $=id=>document.getElementById(id);

let ws=null;
let mode='demo';
let running=false;
let realConnected=false;
let scanNo=1;
let scanTimer=null;
let reconnectTimer=null;

let trades=0;
let wins=0;
let losses=0;
let balance=100;
let profit=0;
let history=[];

let markets={
 crypto:{symbols:[],ticks:{}},
 forex:{symbols:[],ticks:{}},
 gold:{symbols:[],ticks:{}}
};

const cryptoNames=[
 "BTC/USD",
 "ETH/USD",
 "LTC/USD",
 "BCH/USD",
 "XRP/USD"
];

const forexNames=[
 "EUR/USD",
 "GBP/USD",
 "USD/JPY",
 "AUD/USD",
 "USD/CAD",
 "EUR/GBP"
];

/* =========================
   BASIC UI
========================= */

function toast(msg){
 const t=$("toast");
 if(!t)return;

 t.textContent=msg;
 t.style.display="block";

 clearTimeout(window.toastTimer);

 window.toastTimer=setTimeout(()=>{
  t.style.display="none";
 },3000);
}

function updateClock(){
 const d=new Date();

 if($("date")){
  $("date").textContent=d.toLocaleDateString(
   "en-GB",
   {
    day:"numeric",
    month:"long",
    year:"numeric"
   }
  );
 }

 if($("clock")){
  $("clock").textContent=d.toLocaleTimeString(
   [],
   {
    hour12:false
   }
  );
 }
}

setInterval(updateClock,1000);
updateClock();

/* =========================
   ACCOUNT MODE
========================= */

function setMode(m){
 mode=m;

 $("demoTab").classList.toggle(
  "active",
  m==="demo"
 );

 $("realTab").classList.toggle(
  "active",
  m==="real"
 );

 if(m==="real"){
  $("authState").textContent=
   realConnected
   ? "REAL ACCOUNT CONNECTED"
   : "REAL ACCOUNT — CONNECT REQUIRED";

  $("loginModal").classList.add("open");

 }else{

  if(running)stopBot();

  $("authState").textContent="Demo account";

  toast("Demo account selected");
 }
}

function closeLogin(){
 $("loginModal").classList.remove("open");
}

/* =========================
   DERIV CONNECTION
========================= */

function setConnection(text){
 const el=$("connectionText");

 if(el){
  el.textContent=text;
 }
}

function connectDeriv(){

 clearTimeout(reconnectTimer);

 if(ws){
  try{
   ws.onclose=null;
   ws.close();
  }catch(e){}
 }

 ws=null;

 markets={
  crypto:{symbols:[],ticks:{}},
  forex:{symbols:[],ticks:{}},
  gold:{symbols:[],ticks:{}}
 };

 setConnection(
  "● DERIV PUBLIC DATA CONNECTING..."
 );

 try{

  /*
   Current Deriv public market-data endpoint.
   No authentication is required.
  */

  ws=new WebSocket(
   "wss://api.derivws.com/trading/v1/options/ws/public"
  );

  ws.onopen=function(){

   setConnection(
    "● DERIV PUBLIC MARKET DATA CONNECTED"
   );

   toast("Deriv market data connected");

   /*
    Ask Deriv for the available markets.
   */

   ws.send(JSON.stringify({
    active_symbols:"brief",
    req_id:1
   }));

  };

  ws.onerror=function(event){

   console.error(
    "Deriv WebSocket error:",
    event
   );

   setConnection(
    "● DERIV CONNECTION ERROR — RETRYING..."
   );
  };

  ws.onclose=function(event){

   console.warn(
    "Deriv WebSocket closed:",
    event.code,
    event.reason
   );

   setConnection(
    "● DERIV DISCONNECTED — RECONNECTING..."
   );

   reconnectTimer=setTimeout(
    connectDeriv,
    3000
   );
  };

  ws.onmessage=function(event){

   try{

    const data=JSON.parse(event.data);

    /*
     Show API errors instead of silently
     leaving the dashboard at CONNECTING.
    */

    if(data.error){

     console.error(
      "Deriv API error:",
      data.error
     );

     setConnection(
      "● DERIV ERROR: "+
      (
       data.error.message ||
       data.error.code ||
       "REQUEST FAILED"
      )
     );

     return;
    }

    /*
     Current Deriv active-symbol response.
    */

    if(
     data.msg_type==="active_symbols" ||
     data.active_symbols
    ){

     const list=
      data.active_symbols ||
      [];

     loadSymbols(list);

     return;
    }

    /*
     Current tick response.
    */

    if(
     data.msg_type==="tick" ||
     data.tick
    ){

     handleTick(data.tick);

     return;
    }

    /*
     Historical tick response.
    */

    if(
     data.msg_type==="history" ||
     data.history
    ){

     handleHistory(data);

     return;
    }

   }catch(error){

    console.error(
     "Deriv message parse error:",
     error
    );
   }
  };

 }catch(error){

  console.error(
   "WebSocket creation failed:",
   error
  );

  setConnection(
   "● DERIV WEBSOCKET FAILED — RETRYING..."
  );

  reconnectTimer=setTimeout(
   connectDeriv,
   3000
  );
 }
}

/* =========================
   SYMBOL PROCESSING
========================= */

function loadSymbols(list){

 if(!Array.isArray(list)){
  setConnection(
   "● DERIV RETURNED NO MARKET LIST"
  );
  return;
 }

 const crypto=[];
 const forex=[];
 const gold=[];

 list.forEach(item=>{

  const id=
   item.underlying_symbol ||
   item.symbol ||
   "";

  const name=
   item.underlying_symbol_name ||
   item.display_name ||
   id;

  const type=
   (
    item.underlying_symbol_type ||
    item.symbol_type ||
    ""
   ).toLowerCase();

  if(!id)return;

  const upper=(
   id+" "+name
  ).toUpperCase();

  /*
   Crypto
  */

  if(
   upper.includes("BTC") ||
   upper.includes("ETH") ||
   upper.includes("LTC") ||
   upper.includes("BCH") ||
   upper.includes("XRP")
  ){

   crypto.push({
    id,
    name,
    type
   });

  }

  /*
   Forex
  */

  if(
   type.includes("forex") ||
   upper.includes("EUR/USD") ||
   upper.includes("GBP/USD") ||
   upper.includes("USD/JPY") ||
   upper.includes("AUD/USD") ||
   upper.includes("USD/CAD") ||
   upper.includes("EUR/GBP")
  ){

   forex.push({
    id,
    name,
    type
   });

  }

  /*
   Gold.
   Keep XAU/USD only.
  */

  if(
   upper.includes("XAU") ||
   upper.includes("GOLD")
  ){

   gold.push({
    id,
    name,
    type
   });
  }

 });

 markets.crypto.symbols=
  pickPreferred(
   crypto,
   cryptoNames
  );

 markets.forex.symbols=
  pickPreferred(
   forex,
   forexNames
  );

 markets.gold.symbols=
  gold.filter(x=>
   x.id.toUpperCase().includes("XAU")
  );

 /*
  If symbols were found, subscribe.
 */

 subscribeMarkets();

 setConnection(
  "● DERIV LIVE — "+
  (
   markets.crypto.symbols.length+
   markets.forex.symbols.length+
   markets.gold.symbols.length
  )+
  " MARKETS"
 );

 renderMarkets();
}

function pickPreferred(
 items,
 preferred
){

 const result=[];

 preferred.forEach(name=>{

  const found=items.find(x=>
   x.id.toUpperCase()===name ||
   x.name.toUpperCase().includes(name)
  );

  if(
   found &&
   !result.some(
    x=>x.id===found.id
   )
  ){

   result.push(found);
  }

 });

 /*
  Add additional markets returned
  by Deriv if available.
 */

 items.forEach(item=>{

  if(
   result.length<6 &&
   !result.some(
    x=>x.id===item.id
   )
  ){

   result.push(item);
  }

 });

 return result.slice(0,6);
}

/* =========================
   LIVE SUBSCRIPTIONS
========================= */

function subscribeMarkets(){

 if(
  !ws ||
  ws.readyState!==WebSocket.OPEN
 ){
  return;
 }

 let requestId=100;

 const all=[
  ...markets.crypto.symbols,
  ...markets.forex.symbols,
  ...markets.gold.symbols
 ];

 all.forEach(symbol=>{

  /*
   Initialize storage.
  */

  if(
   markets.crypto.symbols.some(
    x=>x.id===symbol.id
   )
  ){

   markets.crypto.ticks[symbol.id]=
    markets.crypto.ticks[symbol.id]||[];

  }

  if(
   markets.forex.symbols.some(
    x=>x.id===symbol.id
   )
  ){

   markets.forex.ticks[symbol.id]=
    markets.forex.ticks[symbol.id]||[];

  }

  if(
   markets.gold.symbols.some(
    x=>x.id===symbol.id
   )
  ){

   markets.gold.ticks[symbol.id]=
    markets.gold.ticks[symbol.id]||[];

  }

  /*
   Subscribe directly to the live tick stream.
  */

  ws.send(JSON.stringify({
   ticks:symbol.id,
   subscribe:1,
   req_id:requestId++
  }));

 });
}

/* =========================
   TICK HANDLING
========================= */

function handleTick(tick){

 if(!tick)return;

 const id=tick.symbol;

 const price=Number(
  tick.quote
 );

 if(
  !id ||
  !Number.isFinite(price)
 ){
  return;
 }

 let group=null;

 if(
  markets.crypto.symbols.some(
   x=>x.id===id
  )
 ){
  group=markets.crypto;
 }

 else if(
  markets.forex.symbols.some(
   x=>x.id===id
  )
 ){
  group=markets.forex;
 }

 else if(
  markets.gold.symbols.some(
   x=>x.id===id
  )
 ){
  group=markets.gold;
 }

 if(!group)return;

 group.ticks[id]=
  group.ticks[id]||[];

 group.ticks[id].push({
  price:price,
  time:Date.now()
 });

 if(
  group.ticks[id].length>50
 ){
  group.ticks[id].shift();
 }

 renderMarkets();
}

function handleHistory(data){

 /*
  History is optional.
  The live tick subscription is sufficient
  for the dashboard.
  We keep this function so history responses
  don't cause errors.
  */

 if(
  data &&
  data.echo_req &&
  data.echo_req.ticks_history
 ){
  return;
 }
}

/* =========================
   SIGNAL ENGINE
========================= */

function getSeries(group){

 const result=[];

 group.symbols.forEach(symbol=>{

  const ticks=
   group.ticks[symbol.id]||[];

  if(ticks.length){

   result.push({
    symbol,
    ticks
   });

  }

 });

 return result;
}

function calculateConfidence(ticks){

 if(
  !ticks ||
  ticks.length<2
 ){
  return 0;
 }

 const recent=
  ticks.slice(-12);

 const first=
  recent[0].price;

 const last=
  recent[recent.length-1].price;

 if(!first)return 0;

 const change=
  ((last-first)/first)*100;

 const strength=
  Math.min(
   45,
   Math.abs(change)*5000
  );

 return Math.round(
  55+strength
 );
}

function signalFor(group){

 const candidates=
  getSeries(group);

 if(!candidates.length){

  return {
   symbol:"Connecting...",
   price:null,
   confidence:0
  };
 }

 /*
  Select the market with the most
  received live ticks.
  */

 candidates.sort(
  (a,b)=>
   b.ticks.length-
   a.ticks.length
 );

 const best=
  candidates[0];

 const ticks=
  best.ticks;

 const latest=
  ticks[ticks.length-1];

 return {
  symbol:best.symbol.id,
  price:latest?
   latest.price:
   null,
  confidence:
   calculateConfidence(ticks)
 };
}

/* =========================
   RENDER MARKETS
========================= */

function renderMarkets(){

 const crypto=
  signalFor(markets.crypto);

 const forex=
  signalFor(markets.forex);

 const gold=
  signalFor(markets.gold);

 renderGroup(
  "crypto",
  crypto,
  "Crypto"
 );

 renderGroup(
  "forex",
  forex,
  "Forex"
 );

 renderGroup(
  "gold",
  gold,
  "Gold"
 );

 window.scanData={
  crypto,
  forex,
  gold
 };
}

function renderGroup(
 key,
 data,
 tableName
){

 if(!data)return;

 const symbol=
  data.symbol||"Connecting...";

 const price=
  data.price;

 const confidence=
  data.confidence||0;

 $(key+"Symbol").textContent=
  symbol;

 $(key+"Price").textContent=
  price===null
  ? "—"
  : Number(price).toFixed(5);

 $(key+"Signal").textContent=
  confidence>=55
  ? "SIGNAL "+confidence+"%"
  : "WAIT";

 const tableSymbol=
  $("table"+tableName);

 const tablePrice=
  $("table"+tableName+"Price");

 const tableSignal=
  $("table"+tableName+"Signal");

 if(tableSymbol)
  tableSymbol.textContent=symbol;

 if(tablePrice)
  tablePrice.textContent=
   price===null
   ? "—"
   : Number(price).toFixed(5);

 if(tableSignal)
  tableSignal.textContent=
   confidence>=55
   ? confidence+"%"
   : "WAIT";
}

/* =========================
   SCANNER
========================= */

function scannerCandidates(){

 const data=
  window.scanData||{};

 const selected=
  $("market").value;

 const result=[];

 if(
  selected==="All Markets" ||
  selected==="Crypto"
 ){

  if(data.crypto)
   result.push([
    "Crypto",
    data.crypto
   ]);

 }

 if(
  selected==="All Markets" ||
  selected==="Forex"
 ){

  if(data.forex)
   result.push([
    "Forex",
    data.forex
   ]);

 }

 if(
  selected==="All Markets" ||
  selected==="Gold"
 ){

  if(data.gold)
   result.push([
    "Gold",
    data.gold
   ]);

 }

 return result.filter(
  x=>x[1].confidence>0
 );
}

function runScan(){

 const candidates=
  scannerCandidates();

 $("scanNumber").textContent=
  scanNo;

 scanNo++;

 if(scanNo>10)
  scanNo=1;

 if(!candidates.length){

  $("scanState").textContent=
   "WAITING FOR LIVE DATA";

  $("scanConfidence").textContent=
   "0%";

  $("scanProgress").style.width=
   "0%";

  return;
 }

 candidates.sort(
  (a,b)=>
   b[1].confidence-
   a[1].confidence
 );

 const best=
  candidates[0];

 const confidence=
  best[1].confidence;

 const threshold=
  Math.max(
   55,
   Number(
    $("scannerThreshold").value
   )||55
  );

 $("scanState").textContent=
  best[0]+" — "+
  (
   confidence>=threshold
   ? "SIGNAL"
   : "WAIT"
  );

 $("scanConfidence").textContent=
  confidence+"%";

 $("scanProgress").style.width=
  Math.min(
   100,
   confidence
  )+"%";
}

function scheduleScanner(){

 clearInterval(scanTimer);

 const speed=
  Math.max(
   1,
   Math.min(
    10,
    Number(
     $("scannerSpeed").value
    )||1
   )
  );

 /*
  Speed 1 = fastest.
  All settings remain below 10 seconds.
 */

 const interval=
  450+
  ((speed-1)*120);

 scanTimer=
  setInterval(
   runScan,
   interval
  );
}

/* =========================
   BOT
========================= */

function startBot(){

 if(running)return;

 if(
  mode==="real" &&
  !realConnected
 ){

  $("loginModal")
   .classList.add("open");

  toast(
   "Connect the real account first"
  );

  return;
 }

 running=true;

 $("botStatus").textContent=
  mode==="real"
  ? "REAL READY"
  : "RUNNING";

 $("botStatus").style.color=
  "#00ff55";

 $("scanLive").textContent=
  "● LIVE";

 scheduleScanner();

 runScan();

 toast(
  mode==="real"
  ? "Real account engine ready"
  : "VIP scanner started"
 );
}

function stopBot(){

 running=false;

 clearInterval(scanTimer);

 scanTimer=null;

 $("botStatus").textContent=
  "STOPPED";

 $("botStatus").style.color=
  "#ff1645";

 $("scanLive").textContent=
  "● READY";

 toast("Bot stopped");
}

/* =========================
   REAL ACCOUNT BACKEND
========================= */

async function connectReal(){

 const email=
  $("modalEmail").value.trim() ||
  $("email").value.trim();

 const password=
  $("modalPassword").value ||
  $("password").value;

 if(!email || !password){

  toast(
   "Enter your Deriv login details"
  );

  return;
 }

 $("email").value=email;
 $("password").value=password;

 try{

  const response=
   await fetch(
    "/api/health",
    {
     method:"GET",
     headers:{
      "Accept":
       "application/json"
     }
    }
   );

  if(!response.ok)
   throw new Error(
    "Backend unavailable"
   );

  realConnected=true;

  $("authState").textContent=
   "REAL ACCOUNT — BACKEND READY";

  $("realBalance").textContent=
   "Real balance: authentication backend ready";

  $("realEngineState").textContent=
   "Real engine: awaiting authenticated Deriv session";

  $("loginModal")
   .classList.remove("open");

  toast(
   "Vercel backend connected"
  );

 }catch(error){

  console.error(
   "Backend error:",
   error
  );

  realConnected=false;

  $("authState").textContent=
   "REAL ACCOUNT — CONNECTION REQUIRED";

  $("realEngineState").textContent=
   "Real engine: backend connection failed";

  toast(
   "Vercel API connection failed"
  );
 }
}

/* =========================
   CONGRATULATIONS
========================= */

function showCongratulations(amount){

 $("congratsProfit").textContent=
  "Profit: €"+
  Number(amount).toFixed(2);

 $("congrats")
  .classList.add("show");

 setTimeout(()=>{
  $("congrats")
   .classList.remove("show");
 },10000);
}

/* =========================
   INPUTS
========================= */

$("stake").addEventListener(
 "change",
 function(){

  if(
   Number(this.value)<0.50
  ){
   this.value="0.50";
  }

 }
);

$("scannerSpeed").addEventListener(
 "change",
 function(){

  if(running)
   scheduleScanner();

 }
);

/* =========================
   START
========================= */

renderHistory();
connectDeriv();

setInterval(
 function(){
  if(running)
   runScan();
 },
 500
);

</script>
